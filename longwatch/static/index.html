    <title>LongWatch — offline footage triage</title>
    <script>
      // Resolve the theme before first paint so the dark default never flashes
      // over an operator who chose the light one.
      (function () {
        try {
          var stored = window.localStorage.getItem('longwatch.theme');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersLight ? 'light' : 'dark');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
